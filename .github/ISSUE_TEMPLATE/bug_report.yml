name: Bug Report
description: Report a problem with tariffy
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill in the fields below as
        completely as possible — it saves us both a few rounds of follow-up questions.

  - type: input
    id: tariffy_version
    attributes:
      label: tariffy version
      description: Found under HACS → tariffy, or in `custom_components/tariffy/manifest.json`.
      placeholder: "e.g. 1.24.3"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.7.3"
    validations:
      required: true

  - type: dropdown
    id: sparte
    attributes:
      label: Contract type (Sparte)
      description: Which kind of contract is affected?
      options:
        - Electricity
        - Electricity (dual tariff, HT/NT)
        - Gas
        - Water
        - Internet
        - Mobile
        - Insurance
        - Other / not sure
    validations:
      required: true

  - type: input
    id: verbrauch_sensor
    attributes:
      label: Consumption sensor (entity_id)
      description: >
        If the contract has a consumption sensor ("Verbrauchssensor" in the config UI)
        configured (Developer tools → States, search for the sensor there). For a dual-tariff
        (HT/NT) contract, this is the high-tariff (HT) sensor.
      placeholder: "e.g. sensor.netzbezug_home_in"

  - type: input
    id: verbrauch_sensor_nt
    attributes:
      label: Low-tariff (NT) consumption sensor (entity_id)
      description: Only for a dual-tariff (HT/NT) electricity contract — the second, low-tariff meter.
      placeholder: "e.g. sensor.netzbezug_home_nt"

  - type: dropdown
    id: state_class
    attributes:
      label: state_class of the consumption sensor
      description: >
        Shown in the sensor's attributes (Developer tools → States → click the sensor). Only
        relevant if you entered a consumption sensor above.
      options:
        - total_increasing
        - total
        - measurement
        - not sure / not specified
        - not applicable
    validations:
      required: true

  - type: input
    id: vertragsbeginn
    attributes:
      label: Contract start date
      description: As entered in the contract (format DD.MM.YYYY).
      placeholder: "e.g. 28.04.2026"

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What did you expect, and what happened instead?
      placeholder: |
        Example: "Consumption (so far)" shows 6000 kWh, but I expected only around 80 kWh since
        the contract start date.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional, but helpful)
      description: >
        Relevant lines from Settings → System → Logs, filtered on "tariffy". For more detail:
        set `logger: logs: custom_components.tariffy: debug` in configuration.yaml, restart HA,
        reproduce the issue, then paste the log lines here.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I'm using the latest tariffy version (HACS → tariffy → check for updates)
        - label: I searched existing issues to see if this was already reported
